<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-splash · STATE TRANSITION</title>
<link rel="stylesheet" href="demo.css">
</head>
<body data-demo="idle">
  <div class="eyebrow">dsh-splash · resident mark · recording harness</div>
  <h1 id="state-name">STATE TRANSITION</h1>
  <p id="effect-name">idle → thinking → waiting → read → search → act → edit · 每 2.6s 切换一次</p>
  <p id="hint">真实 bundle · 46px 标记放大 2.2× · 建议窗口 1440×900</p>
  <div id="dots">
    <span data-dot="idle" data-on="true"></span>
    <span data-dot="thinking"></span>
    <span data-dot="waiting"></span>
    <span data-dot="read"></span>
    <span data-dot="search"></span>
    <span data-dot="act"></span>
    <span data-dot="edit"></span>
    <small>2.6s / state</small>
  </div>
  <button id="replay">重播序列</button>

  <div id="fx-card">
    <div id="fx-editor" contenteditable="true">dsh-splash recording harness</div>
    <button id="fx-model" aria-label="选择模型，当前 DeepSeek-V4.1-Flash，推理等级 High">DeepSeek-V4.1-Flash · High</button>
  </div>

  <div class="footer">actual client bundle · no mocks for the mark · auto sequence</div>

  <script>
    window.DEMO_STATE = 'idle';
    window.DEMO_TRANSITION = true;
  </script>
  <script src="harness.js"></script>
</body>
</html>
